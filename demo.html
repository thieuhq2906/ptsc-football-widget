<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTSC Cup 6v6 · demo nhúng</title>
<style>
  body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #f4f1e8; color: #1d2340; }
  main { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  code { background: #fff; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>PTSC Cup 6v6 — widget nhúng</h1>
  <p>Mỗi thẻ <code>&lt;div class="ptsc-football"&gt;</code> là một trận độc lập. Chỉ cần thêm <code>ptsc-football.js</code> (để <code>ptsc-football.css</code> cùng thư mục).</p>
  <div class="ptsc-football" data-seed="7" data-caption="Sân 6 người · Đỏ gặp Xanh · máy quay rộng bám theo bóng"></div>
  <div class="row">
    <div class="ptsc-football" data-seed="3"></div>
    <div class="ptsc-football" data-seed="12"></div>
  </div>
</main>
<script src="ptsc-football.js" defer></script>
</body>
</html>
